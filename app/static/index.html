<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI Calling Dashboard</title><style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--brand:#635bff;--green:#16a34a;--red:#dc2626;--amber:#d97706;--shadow:0 14px 40px rgba(16,24,40,.08)}[data-theme=dark]{--bg:#09090b;--panel:#111113;--text:#fafafa;--muted:#a1a1aa;--line:#27272a;--shadow:0 14px 40px rgba(0,0,0,.35)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:22px;background:var(--panel);border-right:1px solid var(--line)}.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:18px}.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#635bff,#00d4ff);box-shadow:var(--shadow)}nav{margin-top:28px;display:grid;gap:8px}.nav{border:0;background:transparent;text-align:left;color:var(--muted);padding:11px 12px;border-radius:10px;font-weight:650;cursor:pointer}.nav.active,.nav:hover{background:rgba(99,91,255,.1);color:var(--brand)}main{padding:26px 34px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.search{flex:1;max-width:620px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--text);box-shadow:var(--shadow)}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:750;cursor:pointer;background:var(--brand);color:white}.btn.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line)}.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.card{padding:18px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.value{font-size:28px;font-weight:850;margin-top:8px}.sub{color:var(--muted);font-size:13px}.charts{grid-template-columns:2fr 1fr;margin-top:16px}.panel{padding:18px;overflow:hidden}.bars{display:grid;gap:9px;margin-top:14px}.bar{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:10px;color:var(--muted);font-size:13px}.fill{height:9px;border-radius:999px;background:linear-gradient(90deg,var(--brand),#00d4ff)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#eef2ff;color:#4338ca}.badge.green{background:#dcfce7;color:#166534}.badge.red{background:#fee2e2;color:#991b1b}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.input,select,textarea{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px}textarea{width:100%;min-height:120px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.live{display:grid;grid-template-columns:380px 1fr;gap:16px}.pulse{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 8px rgba(22,163,74,.15);display:inline-block}.wave{height:86px;border-radius:14px;background:repeating-linear-gradient(90deg,rgba(99,91,255,.2) 0 8px,transparent 8px 16px);animation:move 1.2s linear infinite}@keyframes move{to{background-position:32px 0}}.toast{position:fixed;right:22px;bottom:22px;background:var(--text);color:var(--bg);padding:12px 14px;border-radius:12px;display:none}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:static}.cards,.charts,.split,.live{grid-template-columns:1fr}main{padding:18px}.topbar{flex-direction:column;align-items:stretch}}
</style></head><body><div class="app"><aside class="sidebar"><div class="logo"><div class="logo-mark"></div>CallOS</div><nav id="nav"></nav><div style="position:absolute;bottom:22px;left:22px;right:22px"><button class="btn secondary" onclick="toggleTheme()">Toggle dark mode</button></div></aside><main><div class="topbar"><input id="globalSearch" class="search" placeholder="Search business, phone, category, campaign, summary, transcript..."><div><button class="btn secondary" onclick="download('json')">Export JSON</button> <button class="btn secondary" onclick="download('csv')">Export CSV</button> <button class="btn" onclick="download('excel')">Export Excel</button></div></div><section id="view"></section></main></div><div id="toast" class="toast"></div><script>
const pages=['Dashboard','Campaigns','Upload Leads','Live Monitor','Calls','Analytics','Settings','Browser Call'];let state={dashboard:null,campaigns:[],calls:[],leads:[]};const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)}function nav(){ $('nav').innerHTML=pages.map((p,i)=>`<button class="nav ${i?'':'active'}" onclick="show('${p}',this)">${p}</button>`).join('')}async function api(p,o){const r=await fetch(p,o);if(!r.ok)throw new Error(await r.text());return r.json()}async function load(){try{state.dashboard=await api('/api/dashboard');state.campaigns=await api('/api/campaigns');state.calls=await api('/api/calls');state.leads=await api('/api/leads')}catch(e){toast('Loading failed: '+e.message)}}function show(p,el){document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active')); if(el)el.classList.add('active'); ({'Dashboard':dashboard,'Campaigns':campaigns,'Upload Leads':upload,'Live Monitor':live,'Calls':calls,'Analytics':analytics,'Settings':settings,'Browser Call':browser}[p])()}function card(k,v){return `<div class="card"><div class="label">${k.replaceAll('_',' ')}</div><div class="value">${v??0}</div><div class="sub">Live from JSON source of truth</div></div>`}function bars(obj){let ent=Array.isArray(obj)?obj:Object.entries(obj||{});let max=Math.max(1,...ent.map(x=>Array.isArray(x)?x[1]:0));return `<div class="bars">${ent.map(([k,v])=>`<div class="bar"><span>${k}</span><div><div class="fill" style="width:${(v/max)*100}%"></div></div><b>${v}</b></div>`).join('')||'<div class="empty">No data yet</div>'}</div>`}function dashboard(){let d=state.dashboard||{cards:{},charts:{}};$('view').innerHTML=`<h1>Outbound AI Calling Dashboard</h1><p class="sub">Premium command center for campaigns, leads, live calls, conversations, analytics, and exports.</p><div class="grid cards">${Object.entries(d.cards).map(([k,v])=>card(k,v)).join('')}</div><div class="grid charts"><div class="panel"><h3>Calls per day</h3>${bars(d.charts.calls_per_day)}</div><div class="panel"><h3>Sentiment Distribution</h3>${bars(d.charts.sentiment_distribution)}</div><div class="panel"><h3>Call Outcomes</h3>${bars(d.charts.call_outcomes)}</div><div class="panel"><h3>Top Objections</h3>${bars(d.charts.top_objections)}</div></div><div class="panel" style="margin-top:16px"><h3>Recent activity</h3>${table(d.recent_activity||[])}</div>`}function table(rows){if(!rows.length)return '<div class="empty">No records yet. Import leads or complete calls to populate this view.</div>';return `<table><thead><tr><th>Business</th><th>Phone</th><th>Category</th><th>Status</th><th>Outcome</th><th>Duration</th><th>Started</th></tr></thead><tbody>${rows.map(c=>`<tr onclick="detail('${c.id}')"><td>${c.business_name||''}</td><td>${c.phone||''}</td><td>${c.category||''}</td><td><span class="badge ${c.status==='completed'?'green':c.status==='failed'?'red':''}">${c.status||''}</span></td><td>${c.outcome||''}</td><td>${c.duration||c.duration_seconds||0}s</td><td>${c.started_at||''}</td></tr>`).join('')}</tbody></table>`}function campaigns(){ $('view').innerHTML=`<h1>Campaigns</h1><div class="toolbar"><input class="input" id="cname" placeholder="Campaign name"><input class="input" id="cdesc" placeholder="Description"><button class="btn" onclick="createCampaign()">Create campaign</button></div><div class="grid cards">${state.campaigns.map(c=>`<div class="card"><div class="label">${c.status||'active'}</div><div class="value" style="font-size:20px">${c.name}</div><p class="sub">${c.description||''}</p><button class="btn secondary" onclick="dup('${c.id}')">Duplicate</button> <button class="btn secondary" onclick="delCampaign('${c.id}')">Delete</button></div>`).join('')||'<div class="empty">No campaigns</div>'}</div>`}async function createCampaign(){await api('/api/campaigns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('cname').value,description:$('cdesc').value})});await load();campaigns();toast('Campaign created')}async function dup(id){await api('/api/campaigns/'+id+'/duplicate',{method:'POST'});await load();campaigns()}async function delCampaign(id){await api('/api/campaigns/'+id,{method:'DELETE'});await load();campaigns()}function upload(){ $('view').innerHTML=`<h1>Upload leads</h1><div class="split"><div class="panel"><h3>Step 1: File or paste spreadsheet</h3><select id="campaign">${state.campaigns.map(c=>`<option value="${c.id}">${c.name}</option>`)}</select><p><input type="file" id="file" accept=".csv,.xls,.xlsx" class="input"></p><textarea id="paste" placeholder="Paste tab-separated rows from Excel with headers"></textarea><h3>Step 2-4: Column mapping & preview</h3><p class="sub">Auto-detect uses headers like business_name, phone, category. Optional mapping JSON can override.</p><textarea id="mapping" placeholder='{"business_name":"Business Name","phone":"Phone Number","category":"Category"}'></textarea><button class="btn" onclick="importLeads()">Step 5: Import</button></div><div class="panel"><h3>Required fields</h3><p>Business Name, Phone Number, Category</p><h3>Optional fields</h3><p>Owner Name, City, State, Website, Notes, and custom fields. Every call receives business name, phone, and category for automatic prompt personalization.</p></div></div>`}async function importLeads(){let fd=new FormData();fd.append('campaign_id',$('campaign').value);fd.append('mapping',$('mapping').value||'{}');fd.append('pasted',$('paste').value);if($('file').files[0])fd.append('file',$('file').files[0]);let r=await api('/api/leads/upload',{method:'POST',body:fd});await load();toast(`Imported ${r.imported} leads; ${r.errors.length} errors`)}function live(){let live=(state.dashboard&&state.dashboard.live_calls)||[];$('view').innerHTML=`<h1>Live Call Monitor <span class="pulse"></span></h1><div class="live"><div class="panel"><h3>Currently calling</h3>${live[0]?`<h2>${live[0].business_name}</h2><p>${live[0].phone}</p><p>${live[0].category}</p><p><span class="badge">${live[0].status}</span></p>`:'<div class="empty">No active calls</div>'}<div class="wave"></div></div><div class="panel"><h3>Live transcript</h3><p class="sub">Streaming-ready transcript surface. When the telephony layer emits events, they can append here without changing layout.</p><pre>${live[0]?.transcript||''}</pre><h3>Recent events</h3>${bars((live[0]?.events||[]).map((e,i)=>[e.type||('event '+i),1]))}</div></div>`}function calls(){let q=$('globalSearch').value.toLowerCase();let rows=state.calls.filter(c=>!q||JSON.stringify(c).toLowerCase().includes(q));$('view').innerHTML=`<h1>Calls</h1><div class="toolbar"><select><option>All campaigns</option></select><select><option>All statuses</option></select><input class="input" type="date"><input class="input" placeholder="Outcome"><button class="btn secondary">Sticky filters ready</button></div><div class="panel">${table(rows)}</div>`}async function detail(id){let d=await api('/api/calls/'+id);$('view').innerHTML=`<h1>${d.call.business_name||'Call Detail'}</h1><div class="split"><div class="panel"><h3>Business Information</h3><p>${d.call.category||''} · ${d.call.phone||''}</p><h3>Call Details</h3><pre>${JSON.stringify(d.call,null,2)}</pre></div><div class="panel"><h3>Extracted JSON</h3><pre>${JSON.stringify(d.response,null,2)}</pre><h3>Transcript</h3><pre>${d.call.transcript||''}</pre></div></div>`}function analytics(){let c=state.dashboard.charts;$('view').innerHTML=`<h1>AI Analytics</h1><div class="grid charts"><div class="panel"><h3>Calls by hour</h3>${bars(c.calls_per_hour)}</div><div class="panel"><h3>Calls by category</h3>${bars(c.calls_by_category)}</div><div class="panel"><h3>Campaign comparison</h3>${bars(c.campaign_comparison)}</div><div class="panel"><h3>Callback times</h3>${bars(c.top_callback_times)}</div></div>`}async function settings(){let s={};try{s=await api('/api/settings')}catch(e){}$('view').innerHTML=`<h1>Settings</h1><div class="panel"><div class="split"><input id="model" class="input" value="${s.model||'gpt-4.1-mini'}" placeholder="Model"><input id="temp" class="input" value="${s.temperature||0.7}" placeholder="Temperature"><input id="voice" class="input" value="${s.voice||''}" placeholder="Voice"><input id="lang" class="input" value="${s.language||'en'}" placeholder="Language"></div><h3>Business prompt template</h3><textarea id="tpl">${s.business_prompt_template||'You are calling {business_name}. They are a {category} business.'}</textarea><button class="btn" onclick="saveSettings()">Save settings</button></div>`}async function saveSettings(){await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:$('model').value,temperature:parseFloat($('temp').value),voice:$('voice').value,language:$('lang').value,business_prompt_template:$('tpl').value})});toast('Settings saved')}function browser(){location.href='/browser'}function download(k){location.href='/api/export/'+k}function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'':'dark'}$('globalSearch').addEventListener('input',()=>{if(document.querySelector('.nav.active')?.textContent==='Calls')calls()});nav();load().then(dashboard);
</script></body></html>
